[General]
background=bg.mp4
type=video
font=DIN-Bold
color=#cdd6f4
fontSize=13
mode=hybrid 
cardPosition=center
cardAlignment=center
enableBlur=true
enableGlow=true
# There are four modes available: hybrid, image, video, and stay.

# image = random selection of image wallpapers only (png, jpg, jpeg, webp)
# video = random selection of video wallpapers only (mp4, gif)
# hybrid = combines random videos and images
# stay = ensures the wallpaper remains set after a reboot or shutdown

# cardPosition options: center, top, bottom, left, right, top-left, top-right, bottom-left, bottom-right
# cardAlignment options: center, left, right
